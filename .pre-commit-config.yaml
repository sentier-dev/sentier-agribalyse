repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=11000]

  # ecoinvent EULA guard — block proprietary Licensed Data from being committed.
  - repo: local
    hooks:
      - id: ecoinvent-eula-guard
        name: ecoinvent EULA guard (no proprietary ecoinvent data)
        entry: .githooks/pre-commit
        language: script
        always_run: true
        pass_filenames: false
