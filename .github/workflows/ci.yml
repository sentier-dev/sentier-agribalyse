name: CI

# The whole test suite runs on synthetic in-repo fixtures: no ecoinvent
# data, credentials, or network downloads are needed. Tests that want the
# real gitignored artifacts (CF-comparison smoke tests) or a uv-provisioned
# Brightway environment (bw_import round-trip) skip themselves.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,bw]" ruff
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
